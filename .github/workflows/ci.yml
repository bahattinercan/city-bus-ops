name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager" — specifying it twice fails the action.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify (lint + typecheck + test + build)
        run: pnpm verify

  desktop:
    name: desktop shell (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web server (standalone)
        run: pnpm --filter @citybus/web build

      - name: Stage the server, compile the shell
        run: |
          pnpm --filter @citybus/desktop prepare:server
          pnpm --filter @citybus/desktop build

      # No window is opened: this boots the Next server on a free loopback port, waits for
      # /api/health, and prints a JSON report. A missing native module or migration folder
      # fails the job.
      - name: Boot the whole stack headlessly
        run: pnpm --filter @citybus/desktop self-test

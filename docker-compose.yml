services:
  db:
    image: postgis/postgis:17-3.5
    container_name: citybus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citybus}
      POSTGRES_USER: ${POSTGRES_USER:-citybus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - citybus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-citybus} -d ${POSTGRES_DB:-citybus}']
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    container_name: citybus-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-citybus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-citybus}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CITYBUS_TENANT_SLUG: ${CITYBUS_TENANT_SLUG:-kutahya}
      CITYBUS_DEMO_PASSWORD: ${CITYBUS_DEMO_PASSWORD:?set CITYBUS_DEMO_PASSWORD in .env}
      NODE_ENV: production
    ports:
      - '${CITYBUS_PORT:-3000}:3000'
    command: sh -lc "pnpm db:migrate && pnpm --filter @citybus/web start"
volumes:
  citybus-pgdata:
